name: Node.js CI
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Clean install dependencies
        run: npm ci
      - name: Build solution
        run: npm run build
      - name: Test solution
        run: npm run test
